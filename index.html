<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%); }
        .card { background: rgba(30, 27, 75, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(148, 163, 184, 0.1); }
        .card:hover { border-color: rgba(148, 163, 184, 0.3); transform: translateY(-2px); }
        .positive { color: #22c55e; }
        .negative { color: #ef4444; }
        .up-arrow::after { content: "↑"; margin-left: 4px; }
        .down-arrow::after { content: "↓"; margin-left: 4px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease-out; }
    </style>
</head>
<body class="gradient-bg text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
